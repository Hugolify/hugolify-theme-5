module:
  mounts:
    - source: assets
      target: assets
    - source: layouts
      target: layouts
    - source: static
      target: static

# Params
# _merge: deep on every map that already exists upstream (in hugolify-theme or
# in a section module): what follows adds to those maps instead of standing in
# for them, so the keys this theme leaves alone keep their default.
params:
  # Hero
  hero:
    _merge: deep
    cover:
      _merge: deep
      desktop: '1600x660'
    desktop: '526x220'

  # Thumbnails: portrait cards, four to a row
  thumbnail:
    _merge: deep
    desktop: '306x459'
    mobile: '315x473'
    scrollsnap: '242x363'
  casestudies:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
      mobile: '315x473'
      scrollsnap: '242x363'
  expertises:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
      mobile: '315x473'
      scrollsnap: '242x363'
  pages:
