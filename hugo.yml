module:
  mounts:
    - source: assets
      target: assets
    - source: layouts
      target: layouts
    - source: static
      target: static

# Params
# _merge: deep on every map that already exists upstream (in hugolify-theme or
# in a section module): what follows adds to those maps instead of standing in
# for them, so the keys this theme leaves alone keep their default.
params:
  # Hero
  hero:
    _merge: deep
    cover:
      _merge: deep
      desktop: '1600x660'
    desktop: '526x220'
    # Every page opens on a hero: a page whose front matter has none gets one
    # built from its title and description, its image laid behind as a
    # darkened cover (the core's func/GetHero)
    fallback:
      _merge: deep
      enable: true
      image:
        _merge: deep
        background: true
        darken: true
    # Dark unless the page picks another theme in the admin (hero > ui >
    # theme): the theme class carries the colours, see
    # hugolify-theme-design-system's components/hero-theme.css
    ui:
      _merge: deep
      theme: dark

  # Thumbnails: portrait cards, four to a row
  thumbnail:
    _merge: deep
    desktop: '306x459'
    mobile: '315x473'
    scrollsnap: '242x363'
  casestudies:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
      mobile: '315x473'
      scrollsnap: '242x363'
  expertises:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
      mobile: '315x473'
      scrollsnap: '242x363'
  pages:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
      mobile: '315x473'
      scrollsnap: '242x363'
  persons:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
      mobile: '315x473'
      scrollsnap: '242x363'
  places:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
      mobile: '315x473'
      scrollsnap: '242x363'
  products:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
      mobile: '315x473'
      scrollsnap: '242x363'
  projects:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
      mobile: '315x473'
      scrollsnap: '242x363'
  posts:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
      mobile: '315x473'
      scrollsnap: '242x363'
  publications:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '306x459'
